---
- name: Load installation tasks
  when: ansible_system == 'Linux'
  ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "install-{{ ansible_distribution | lower }}.yml"
        - "install-{{ ansible_os_family | lower }}.yml"
        - "install-{{ ansible_system | lower }}.yml"
        - "install-fallback.yml"

- name: Start bluetooth service
  when: ansible_system  == 'Linux'
  become: true
  ansible.builtin.systemd_service:
    name: "bluetooth.service"
    state: started
    enabled: true
# TODO: might be relevant for desktop: https://wiki.archlinux.org/title/Bluetooth#Dual_boot_pairing
